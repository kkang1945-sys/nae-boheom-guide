[project]
name = "insurance-gap-app"
version = "0.1.0"
description = "로컬 우선 개인 보험 분석 앱"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.26,<2",
  "reportlab>=4.4,<5",
  "pdfplumber>=0.11.9,<0.12",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.26,<2"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["insurance_app"]
