<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--field:#f2f3f5;--ink:#17181c;--soft:#41444c;--muted:#8a8f99;--primary:#5146ff;--primary-dark:#3f35e8;--primary-soft:#eeedff;--line:#e7e8ec;--good:#19a563;--good-soft:#e9f8f0;--warn:#a86800;--warn-soft:#fff4da;--danger:#ef4d57;--danger-soft:#fff0f1;--radius:22px;--shadow:0 8px 26px rgba(30,32,42,.05)}
*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--bg)}body{margin:0!important;min-height:100vh;background:var(--bg)!important;color:var(--ink)!important;font-family:Pretendard,"Noto Sans KR",Inter,system-ui,-apple-system,sans-serif!important;letter-spacing:-.018em}main{width:min(100%,1040px)!important;max-width:1040px!important;margin:0 auto!important;padding:32px 28px 90px!important}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;overflow-x:auto;margin:-32px -28px 28px!important;padding:17px 28px 14px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);color:transparent!important;white-space:nowrap;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav a{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--field);color:var(--soft)!important;font-size:.9rem;font-weight:750}nav a:last-child{background:var(--primary-soft);color:var(--primary-dark)!important}
header,section,article,.panel{margin:0 0 16px!important;padding:28px!important;border:1px solid var(--line)!important;border-radius:var(--radius)!important;background:var(--panel)!important;color:var(--ink)!important;box-shadow:var(--shadow)!important}section>article,article>article,.panel article{margin:14px 0 0!important;padding:20px!important;border-radius:17px!important;box-shadow:none!important}
h1,h2,h3{color:var(--ink);word-break:keep-all}h1{margin:0 0 14px;font-size:clamp(2.1rem,5vw,3.25rem)!important;line-height:1.08;letter-spacing:-.055em}h2{margin:0 0 12px;font-size:clamp(1.28rem,2.7vw,1.72rem);line-height:1.25;letter-spacing:-.038em}h3{margin:0 0 9px;font-size:1.08rem}p,li{line-height:1.62}p{margin:9px 0}a{color:var(--primary-dark)!important;text-decoration:none}a:hover{opacity:.8;text-decoration:none!important}small,.muted,.source{color:var(--muted)!important}.eyebrow{display:inline-flex;margin-bottom:13px;color:var(--primary)!important;font-size:.76rem!important;font-weight:850!important;letter-spacing:.08em!important;text-transform:uppercase}.lead{color:var(--muted)!important;font-size:1.04rem}
.notice,.info,.guidance{padding:16px 18px!important;border:0!important;border-radius:15px!important;background:#edf3ff!important;color:#34425c!important}.warning,.warn,.pending,.block{padding:16px 18px!important;border:0!important;border-radius:15px!important;background:var(--warn-soft)!important;color:#75500e!important}.ok,.pass,.success,.confirmed{background:var(--good-soft)!important;color:#137247!important}.status,.rank,.chip{display:inline-flex!important;align-items:center;gap:5px;width:fit-content;padding:7px 11px!important;border:0!important;border-radius:999px!important;background:var(--primary-soft)!important;color:var(--primary-dark)!important;font-size:.8rem!important;font-weight:800!important}
form{margin:0}fieldset{border:0;padding:0}label{color:var(--soft)!important;font-weight:750}input,select,textarea{width:100%;min-height:52px;padding:14px 15px!important;border:1px solid var(--line)!important;border-radius:14px!important;background:var(--field)!important;color:var(--ink)!important;font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(81,70,255,.1)!important}input[type=checkbox],input[type=radio]{width:20px;min-height:20px;accent-color:var(--primary)}button,.button,input[type=submit]{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 18px!important;border:0!important;border-radius:14px!important;background:var(--primary)!important;color:#fff!important;font:inherit;font-weight:820!important;box-shadow:none!important;cursor:pointer}button:hover,.button:hover{background:var(--primary-dark)!important;opacity:1}
table{width:100%;border-collapse:collapse;background:transparent!important}th,td{padding:14px 12px!important;border-color:var(--line)!important;text-align:left}th{background:transparent!important;color:var(--muted)!important;font-size:.84rem}details{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)!important}summary{color:var(--soft)!important;font-weight:780;cursor:pointer}hr{border:0;border-top:1px solid var(--line)}.metric{padding:18px!important;border:0!important;border-radius:16px!important;background:var(--field)!important;color:var(--ink)!important}.metric small{display:block;margin-bottom:8px;color:var(--muted)!important}.metric strong{color:var(--ink)!important}.metric.gap strong{color:var(--danger)!important}.card:before{display:none!important}.actions{gap:8px!important}.actions a{padding:10px 13px!important;border:0!important;border-radius:12px!important;background:var(--field)!important;color:var(--soft)!important;font-weight:750}

</style>
