<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>전체 분석 데이터 삭제</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}
    main{max-width:720px;margin:auto;padding:28px 16px}
    section{background:#fff;padding:24px;border-radius:16px}
    p,label{line-height:1.7}.warning{background:#fff4d6;padding:14px;border-radius:10px}
    input{display:block;box-sizing:border-box;width:100%;max-width:360px;margin:8px 0 18px;padding:12px;border:1px solid #9aa8ba;border-radius:8px;font-size:16px}
    button{padding:12px 18px;border:0;border-radius:10px;background:#b42318;color:#fff;font-weight:700;cursor:pointer}
    a{color:#175cd3}@media(max-width:520px){section{padding:20px 16px}}
  </style>
{% include '_theme.html' %}</head>
<body><main><p><a href="/">← 보험증권 목록</a></p><section><h1>전체 분석 데이터 삭제</h1><p class="warning">문서 {{ documents|length }}개, 분석 대상자 {{ subject_count }}명과 관련 분석 데이터를 삭제합니다. 앱 업로드 폴더의 원본만 함께 삭제하며 앱 밖 원본은 보존합니다.</p><p>사용자가 다운로드하거나 다른 곳에 복사한 PDF·CSV 파일은 앱에서 삭제할 수 없습니다. 해당 위치에서 직접 삭제해 주세요.</p><form method="post" action="/data/delete"><label for="confirm-delete"><strong>DELETE_ALL</strong> 입력</label><input id="confirm-delete" name="confirm_delete" autocomplete="off" required><button>전체 분석 데이터 삭제</button></form></section></main></body>
</html>
