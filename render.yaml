services:
  - type: web
    name: nae-boheom-guide
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn insurance_app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.10"
